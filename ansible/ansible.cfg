[defaults]
inventory = inventory.ini
host_key_checking = True
retry_files_enabled = False
task_timeout = 600
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o ServerAliveInterval=10 -o ServerAliveCountMax=3
retries = 3

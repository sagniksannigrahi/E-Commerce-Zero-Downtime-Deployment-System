# ShopFlow reverse proxy (installed by Ansible to /etc/nginx/sites-available/shopflow)
#
# Public traffic arrives on port 80 and is forwarded to the ACTIVE colour.
# The active colour lives in a tiny separate file that deploy.sh replaces
# atomically:  /etc/nginx/shopflow/active_upstream.conf
#     server 127.0.0.1:5001;   <- blue
#     server 127.0.0.1:5002;   <- green
# After replacing it, deploy.sh runs `nginx -t` and a graceful reload: new
# worker processes pick up the new upstream while old workers finish the
# requests they are already serving, so no connection is dropped.

upstream shopflow_active {
    include /etc/nginx/shopflow/active_upstream.conf;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/shopflow.access.log;
    error_log  /var/log/nginx/shopflow.error.log warn;

    client_max_body_size 1m;

    location / {
        proxy_pass http://shopflow_active;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Shows which backend port answered (5001 = blue, 5002 = green)
        add_header X-Upstream $upstream_addr always;
    }

    # Lets you check Nginx itself without touching the app
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx ok\n";
    }
}

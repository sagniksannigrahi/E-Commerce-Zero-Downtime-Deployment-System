# =============================================================================
# ShopFlow operations - run from GitHub: Actions > "Operations" > Run workflow
#
#   provision         Run the Ansible playbook against the EC2 instance
#   status            Show live colour, containers and deployment history
#   rollback          Switch traffic back to the standby colour (instant)
#   simulate-failure  Deploy a deliberately broken release - it must be refused
#   deploy            Normal blue-green deployment of the current main branch
#
# Useful when your own network blocks SSH (port 22): GitHub's servers do
# the SSH work instead.
# =============================================================================
name: Operations

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        default: status
        type: choice
        options: [provision, status, rollback, simulate-failure, deploy]

concurrency:
  group: shopflow-production     # shared with the CI/CD workflow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  operate:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Configure SSH (key + verified host key)
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/shopflow_deploy
          chmod 600 ~/.ssh/shopflow_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH_CMD=ssh -i $HOME/.ssh/shopflow_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=/opt/shopflow/releases/${GITHUB_SHA::7}-ops${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- provision
      - name: Install Ansible
        if: inputs.action == 'provision'
        run: pipx install ansible-core

      - name: Run Ansible playbook
        if: inputs.action == 'provision'
        working-directory: ansible
        run: |
          ansible-playbook playbook.yml \
            -e "ansible_host=$EC2_HOST ansible_user=$EC2_USER" \
            -e "ansible_ssh_private_key_file=$HOME/.ssh/shopflow_deploy"

      # ---------------------------------------------------------------- deploy / simulate-failure
      - name: Upload release files
        if: inputs.action == 'deploy' || inputs.action == 'simulate-failure'
        run: |
          rsync -az --delete -e "$SSH_CMD" \
            --exclude .git --exclude .github --exclude tests --exclude docs \
            ./ "$EC2_USER@$EC2_HOST:$RELEASE_DIR/"

      - name: Blue-green deploy
        if: inputs.action == 'deploy'
        run: |
          $SSH_CMD "$EC2_USER@$EC2_HOST" \
            "APP_VERSION='$(cat VERSION)' BUILD_SHA='${GITHUB_SHA::7}' bash '$RELEASE_DIR/deployment/deploy.sh'"

      - name: Deploy a broken release (expected to be REFUSED)
        if: inputs.action == 'simulate-failure'
        run: |
          set +e
          $SSH_CMD "$EC2_USER@$EC2_HOST" \
            "APP_VERSION='$(cat VERSION)-broken' BUILD_SHA='${GITHUB_SHA::7}' bash '$RELEASE_DIR/deployment/deploy.sh' --simulate-failure"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::The broken release was deployed - this should never happen"; exit 1
          fi
          echo "Broken release was refused (exit code $rc). Checking the public site is still healthy..."
          curl -fsS "http://$EC2_HOST/health"
          echo
          echo "::notice::Broken release refused - live traffic stayed on the healthy version"

      # ---------------------------------------------------------------- rollback
      - name: Roll back to the standby colour
        if: inputs.action == 'rollback'
        run: |
          $SSH_CMD "$EC2_USER@$EC2_HOST" \
            'bash "$(ls -1dt /opt/shopflow/releases/*/ | head -1)deployment/rollback.sh"'

      # ---------------------------------------------------------------- always
      - name: Server status
        if: always()
        run: |
          $SSH_CMD "$EC2_USER@$EC2_HOST" \
            'R="$(ls -1dt /opt/shopflow/releases/*/ 2>/dev/null | head -1)"; if [ -n "$R" ]; then bash "${R}deployment/status.sh"; else echo "No release deployed yet"; fi' || true
          echo "Public: $(curl -fsS --max-time 5 "http://$EC2_HOST/health" || echo 'not responding')"

      - name: Remove SSH key from runner
        if: always()
        run: rm -f ~/.ssh/shopflow_deploy
